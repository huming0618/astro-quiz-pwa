<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a237e" />
  <meta name="description" content="天文知识竞赛答题练习 Progressive Web App" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>天文老师好 · 知识竞赛答题</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="logo" aria-hidden="true"><span>★</span></div>
      <div class="brand">
        <h1>天文老师好 · 答题练习</h1>
        <p>离线可用 · 竞赛题库</p>
      </div>
    </header>

    <div id="installBanner" class="install-banner">
      <p>可安装到主屏幕，支持离线练习</p>
      <button class="btn btn-primary" style="width:auto;padding:8px 14px" id="btnInstall">安装</button>
    </div>

    <!-- HOME -->
    <section id="view-home">
      <div class="card">
        <h2>开始练习</h2>
        <p class="muted" id="homeStats">正在加载题库…</p>
        <div class="chips" id="homeChips"></div>

        <div class="field">
          <label for="modeSelect">练习模式</label>
          <select id="modeSelect">
            <option value="random">随机练习</option>
            <option value="section">按章节 / 来源</option>
            <option value="wrong">只练错题（本地记录）</option>
          </select>
        </div>

        <div class="field hidden" id="sectionField">
          <label for="sectionSelect">选择章节 / 来源</label>
          <select id="sectionSelect"></select>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="diffSelect">难度</label>
            <select id="diffSelect">
              <option value="all">全部难度</option>
              <option value="简单">简单</option>
              <option value="中等">中等</option>
              <option value="困难">困难</option>
            </select>
          </div>
          <div class="field">
            <label for="countSelect">题目数量</label>
            <select id="countSelect">
              <option value="10">10 题</option>
              <option value="20" selected>20 题</option>
              <option value="30">30 题</option>
              <option value="50">50 题</option>
              <option value="0">全部（最多 200）</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>
            <input type="checkbox" id="onlyAnswered" checked />
            仅含标准答案的题目（便于自动判分）
          </label>
        </div>

        <button class="btn btn-accent" id="btnStart">开始答题</button>
      </div>

      <div class="card">
        <h2>题库来源</h2>
        <p class="muted">题目整理自 5 份天文知识竞赛资料（PDF / DOCX），本地 JSON 加载，无需后端。</p>
        <ul class="muted" id="sourceList" style="padding-left:1.1rem;margin:8px 0 0;line-height:1.7"></ul>
      </div>
    </section>

    <!-- QUIZ -->
    <section id="view-quiz" class="hidden">
      <div class="card">
        <div class="progress-wrap">
          <div class="progress-meta">
            <span id="progressText">第 1 / 20 题</span>
            <span id="scoreLive">得分 0</span>
          </div>
          <div class="bar"><i id="progressBar"></i></div>
        </div>
        <div class="chips" id="qMeta"></div>
        <div class="stem" id="qStem"></div>
        <div class="options" id="qOptions"></div>
        <div id="qFillWrap" class="hidden">
          <input class="fill-input" id="qFill" placeholder="请输入答案字母，如 A 或 ABC" autocomplete="off" />
        </div>
        <div id="qFeedback" class="feedback hidden"></div>
        <div id="qKnowledge" class="knowledge hidden" aria-live="polite"></div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="btnQuit">结束</button>
          <button class="btn btn-primary" id="btnSubmit">提交答案</button>
        </div>
        <div class="btn-row hidden" id="nextRow">
          <button class="btn btn-ghost" id="btnSkipExplain">查看题库信息</button>
          <button class="btn btn-ok" id="btnNext">下一题</button>
        </div>
      </div>
    </section>

    <!-- RESULT -->
    <section id="view-result" class="hidden">
      <div class="card">
        <h2>练习结束</h2>
        <div class="score-big" id="resultScore">0%</div>
        <div class="stats-grid">
          <div class="stat"><b id="statTotal">0</b><span>总题数</span></div>
          <div class="stat"><b id="statCorrect">0</b><span>答对</span></div>
          <div class="stat"><b id="statWrong">0</b><span>答错/未答</span></div>
        </div>
        <p class="muted" id="resultHint"></p>
        <div class="btn-row">
          <button class="btn btn-ghost" id="btnHome">返回首页</button>
          <button class="btn btn-accent" id="btnRetry">再来一轮</button>
        </div>
        <button class="btn btn-primary" style="margin-top:10px" id="btnReviewWrong">复习本轮错题</button>
      </div>
    </section>

    <p class="footer-note">天文老师好 · Astro Quiz PWA<br/>数据仅存于本机浏览器（错题记录）</p>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
